name: Feature request
description: Propose a new capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is currently painful, and for whom?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the API / UI / behaviour you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other competing MCP toolkits that do this well? Cite repo + commit if relevant.

  - type: input
    id: effort
    attributes:
      label: Rough effort estimate
      placeholder: e.g. "2 days" or "unknown"
