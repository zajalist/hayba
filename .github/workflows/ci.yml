name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-dependency-audit:
    name: Production dependency audit — reachability + expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The audit needs the resolved lock graph, not lifecycle scripts. In
      # particular, onnxruntime-node's vulnerable AdmZip path is postinstall-
      # only; an audit job must not execute the parser it is assessing.
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      # The script invokes `npm audit --omit=dev --json` itself, parses raw JSON
      # in memory, and emits only sanitized package/advisory policy codes.
      - name: Reject unassessed or expired production risk
        run: npm run audit:production

  lint:
    name: TypeScript lint + format check (mcp-tools/hayba-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm install

      # Scoped to the Node MCP server and non-blocking (like the sidecar ruff
      # step). The restructured tree carries large pre-existing subsystems that
      # predate this config and were never linted/formatted; enforcing repo-wide
      # or even subtree-wide would brick CI on code untouched by current work.
      # Kept as a visible signal until a formatting baseline is adopted.
      - name: Lint
        run: npx eslint mcp-tools/hayba-mcp || true

      - name: Format check
        run: npx prettier --check "mcp-tools/hayba-mcp/**/*.{ts,js,json,md}" --ignore-path .prettierignore || true

  node:
    name: Node MCP server — typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Typecheck
        working-directory: mcp-tools/hayba-mcp
        run: npx tsc --noEmit

      - name: Build
        working-directory: mcp-tools/hayba-mcp
        run: npx tsc

      - name: Test
        working-directory: mcp-tools/hayba-mcp
        run: |
          if [ -f vitest.config.ts ] || [ -f jest.config.ts ]; then
            npm test
          else
            echo "no test runner configured, skipping"
          fi

      # Separate step so a sidecar/cpp/wrapper drift shows up with its
      # own clearly-labeled failure in the GitHub UI instead of getting
      # buried in vitest output. The script is also exposed as a vitest
      # test (scripts/__tests__/check-legacy-wrappers.test.ts) so local
      # `npm test` runs surface the same drift.
      - name: Legacy command wrapper lint
        working-directory: mcp-tools/hayba-mcp
        run: npm run lint:legacy-wrappers

  architecture:
    name: Architecture — clean install + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean install
        run: npm ci --ignore-scripts

      # The package test builds first, exercises the real demo server tests,
      # then runs the TypeScript suite. It also owns the CDN-only Three.js
      # boundary guard, so an inert npm dependency cannot drift back unnoticed.
      - name: Build and test
        run: npm test --workspace=@hayba/architecture

      - name: Typecheck
        run: npm run typecheck --workspace=@hayba/architecture

  sidecar:
    name: Visual sidecar — import + test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-tools/hayba-mcp/addons/visual-embeddings
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Deliberately NOT installing torch. The sidecar's model loaders import
      # their heavy dependency inside the function that needs it, so the app
      # must start and answer /health with none of the weights present. A CI run
      # that installed torch would not be testing that property — it would be
      # hiding a regression in it.
      - name: Install sidecar (torch-free)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .[test]

      # This job was previously named "import + lint" and never imported
      # anything. Importing the app is the check: it was unimportable without
      # multi-GB weights for as long as the model modules imported at module
      # scope, which took /health down with them.
      - name: Import the app without weights
        run: python -c "from hayba_sidecar.server import app; print(sorted({r.path for r in app.routes}))"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check . || true # non-blocking until a style baseline is adopted
