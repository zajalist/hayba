name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: TypeScript lint + format check (mcp-tools/hayba-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm install

      # Scoped to the Node MCP server and non-blocking (like the sidecar ruff
      # step). The restructured tree carries large pre-existing subsystems that
      # predate this config and were never linted/formatted; enforcing repo-wide
      # or even subtree-wide would brick CI on code untouched by current work.
      # Kept as a visible signal until a formatting baseline is adopted.
      - name: Lint
        run: npx eslint mcp-tools/hayba-mcp || true

      - name: Format check
        run: npx prettier --check "mcp-tools/hayba-mcp/**/*.{ts,js,json,md}" --ignore-path .prettierignore || true

  node:
    name: Node MCP server — typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Typecheck
        working-directory: mcp-tools/hayba-mcp
        run: npx tsc --noEmit

      - name: Build
        working-directory: mcp-tools/hayba-mcp
        run: npx tsc

      - name: Test
        working-directory: mcp-tools/hayba-mcp
        run: |
          if [ -f vitest.config.ts ] || [ -f jest.config.ts ]; then
            npm test
          else
            echo "no test runner configured, skipping"
          fi

      # Separate step so a sidecar/cpp/wrapper drift shows up with its
      # own clearly-labeled failure in the GitHub UI instead of getting
      # buried in vitest output. The script is also exposed as a vitest
      # test (scripts/__tests__/check-legacy-wrappers.test.ts) so local
      # `npm test` runs surface the same drift.
      - name: Legacy command wrapper lint
        working-directory: mcp-tools/hayba-mcp
        run: npm run lint:legacy-wrappers

  sidecar:
    name: Visual sidecar — import + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install sidecar
        working-directory: mcp-tools/hayba-mcp/addons/visual-embeddings
        run: |
          if [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install ruff
            pip install -e .[cpu] || pip install -e .
          fi

      - name: Lint
        working-directory: mcp-tools/hayba-mcp/addons/visual-embeddings
        run: ruff check . || true   # non-blocking until a style baseline is adopted
