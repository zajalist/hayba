<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hayba Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #1b1e24; color: #e5e8eb; font-family: "Noto Sans", system-ui, sans-serif; overflow: hidden; }
      #hayba-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1b1e24; z-index: 9999; transition: opacity 450ms ease; }
      #hayba-splash.fading { opacity: 0; pointer-events: none; }
      #hayba-splash .name { font-family: "Charis SIL", Georgia, serif; font-size: 56px; letter-spacing: 0.04em; }
      #hayba-splash .rule { width: 96px; height: 2px; background: #B56A1D; margin: 18px 0; }
      #hayba-splash .tagline { color: #a8aeb8; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="hayba-splash">
      <div class="name">Hayba</div>
      <div class="rule"></div>
      <div class="tagline">Worldbuilding tectonics</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
