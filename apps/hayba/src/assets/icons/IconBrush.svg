<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Handle: tapered slate-blue parallelogram running upper-right to lower-left -->
  <path d="M44 6 L58 20 L34 44 L20 30 Z" fill="#3F4F70" stroke="#A0B5E0" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wood-grain seam down the handle -->
  <line x1="39" y1="11" x2="29" y2="21" stroke="#A0B5E0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ferrule: bright sun-yellow band where the bristles meet the handle -->
  <path d="M20 30 L34 44 L28 50 L14 36 Z" fill="#FFD060" stroke="#1F2A3D" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bristle fan: cream body flaring outward, splayed -->
  <path d="M14 36 L28 50 L24 60 L4 52 Z" fill="#DED4C3" stroke="#B56A1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bristle creases -->
  <line x1="12" y1="46" x2="8" y2="56" stroke="#B56A1D" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="48" x2="14" y2="58" stroke="#B56A1D" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Paint dab dripping off the tip -->
  <circle cx="3" cy="58" r="2.5" fill="#B56A1D"/>
</svg>
