[package]
name = "hayba-tectonics-v2"
version = "0.1.0"
edition = "2021"
authors = ["Hayba Team"]
description = "High-fidelity Rust port of Concord Consortium's tectonic-explorer simulation, plus Hayba climate / biome / mantle / erosion extensions."
license = "MIT"

[dependencies]
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
glam = { version = "0.33", features = ["serde", "rand"] }
rand = "0.8"
rand_core = "0.6"
rand_pcg = "0.3"
rayon = "1"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "hayba_tectonics_v2"
path = "src/lib.rs"

[[bin]]
name = "te-port"
path = "src/bin/te-port.rs"

[[bin]]
name = "dump-d2-neighbours"
path = "src/bin/dump_d2_neighbours.rs"
