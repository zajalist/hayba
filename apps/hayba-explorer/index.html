<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hayba Explorer</title>
    <!-- Fonts are bundled via @fontsource (see src/main.tsx) — no external fetch. -->
    <style>
      :root {
        --bg-deep: #1b1e24;
        --text-primary: #e5e8eb;
        --text-muted: #6b7280;
        --accent: #B56A1D;
        --rule: #2f343d;
      }
      html, body, #root {
        height: 100%; margin: 0; padding: 0;
        background: var(--bg-deep);
        color: var(--text-primary);
        font-family: "Segoe UI", "Noto Sans", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* Minimal splash — just the logo on a flat field, with a vertical
         metallic shimmer sweep + a very subtle warp. No backlight, no
         wordmark, no tagline. */
      #hayba-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #14171c;
        transition: opacity 500ms cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      #hayba-splash.fading { opacity: 0; pointer-events: none; }
      #hayba-splash .logo-wrap {
        position: relative;
        width: 120px; height: 145px;
        animation: hayba-warp 5.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #hayba-splash .logo {
        width: 100%; height: 100%;
        display: block;
      }
      /* Vertical shine — a soft band that sweeps top→bottom across the
         logo bounds. mix-blend-mode: screen brightens the logo paint as
         the band passes; the dark background stays unaffected. Slight
         blur softens the edges so it reads as a polished-metal shimmer
         rather than a hard sliding bar. */
      #hayba-splash .shine {
        position: absolute; inset: -10%;
        pointer-events: none;
        background:
          linear-gradient(180deg,
            transparent 0%,
            transparent 42%,
            rgba(255, 255, 255, 0.45) 50%,
            transparent 58%,
            transparent 100%);
        mix-blend-mode: screen;
        filter: blur(2px);
        animation: hayba-shine 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes hayba-shine {
        0%   { transform: translateY(-110%); opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateY( 110%); opacity: 0; }
      }
      /* Subtle warp — a gentle perspective tilt + scale wobble. Not a
         turbulence-filter distortion (that would be expensive and prone
         to banding); just enough motion that the logo feels alive. */
      @keyframes hayba-warp {
        0%, 100% { transform: perspective(800px) rotateX(0deg)   rotateY(0deg)   scale(1);     }
        25%      { transform: perspective(800px) rotateX(1.2deg) rotateY(-1deg)  scale(1.012); }
        50%      { transform: perspective(800px) rotateX(0deg)   rotateY(1deg)   scale(1);     }
        75%      { transform: perspective(800px) rotateX(-1deg)  rotateY(-0.4deg) scale(0.992); }
      }
    </style>
  </head>
  <body>
    <div id="hayba-splash">
      <div class="logo-wrap">

          <path d="M19 23.9102V48.4551H83.5H148V23.9102C113.042 48.4551 53.958 48.4551 19 23.9102Z" fill="#B56A1D"/>
          <path d="M19 73C69.2485 83.4432 97.0527 83.2572 148 73V48.4551H83.5H19V73Z" fill="#B56A1D"/>
          <path d="M19 23.9102C53.958 48.4551 113.042 48.4551 148 23.9102C116.295 -4.10732 49.1347 -3.83245 19 23.9102Z" fill="#B56A1D"/>
          <path d="M82.748 0C86.0616 0.000172138 88.748 2.6864 88.748 6L97.9375 11.75L103.911 20.3926L93.4385 19.542L87.2451 15.9668V22.499L82.7451 31.9941L78.248 22.499V15.6309L71.4727 19.542L61 20.3926L66.9746 11.75L76.748 6C76.748 2.68629 79.4343 0 82.748 0Z" fill="#DED4C3"/>

        <div class="shine" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
