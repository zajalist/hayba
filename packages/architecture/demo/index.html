<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hayba · Architecture Atlas</title>
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./studio.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
  /* —— Hayba UE plugin design language — shared with linguistics workbench —— */
  :root {
    --bg-deep:     #1b1e24;
    --bg-base:     #22262e;
    --bg-panel:    #2a2e36;
    --bg-raised:   #303540;
    --bg-elevated: #353a45;
    --border-hard: #1a1d22;
    --border-mid:  #2f343d;
    --border-soft: #3d434e;
    --accent:      #B56A1D;
    --accent-hover:#D17F2A;
    --accent-dim:  #B56A1D22;
    --accent-glow: #B56A1D55;
    --cream:       #DED4C3;
    --text-primary:   #e5e8eb;
    --text-secondary: #a8aeb8;
    --text-muted:     #6b7280;
    --text-accent:    #D17F2A;
    --status-green:   #4db38a;
    --status-orange:  #B56A1D;
    --status-red:     #e06464;
    --tag-blue:    #6a9fdc;
    --tag-pink:    #c685c0;
    --tag-green:   #7ec48e;
    --tag-amber:   #e0b85e;
    --font-ui:   'Noto Sans', 'Segoe UI', 'Roboto', system-ui, sans-serif;
    --font-mono: 'Noto Sans Mono', 'Consolas', 'Cascadia Mono', monospace;

    /* —— material chip colors —— */
    --mat-stone:        #94a3b8;
    --mat-timber:       #b48a5a;
    --mat-mudbrick:     #a06a3e;
    --mat-adobe:        #c89060;
    --mat-rammed-earth: #8c6843;
    --mat-brick:        #b85a4a;
    --mat-concrete:     #8a8e95;
    --mat-wattle-daub:  #c4a96a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    display: grid;
    grid-template-rows: 38px 1fr;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-muted); }
  .accent { color: var(--accent); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

  /* —— toolbar —— */
  .toolbar {
    background: var(--bg-base);
    border-bottom: 1px solid var(--border-hard);
    display: flex; align-items: center;
    padding: 0 18px; gap: 0;
  }
  .toolbar .brand-block { display: flex; align-items: center; gap: 10px; }
  .toolbar .logo { height: 26px; width: auto; }
  .toolbar .brand {
    color: var(--text-primary); font-weight: 600; font-size: 14px;
    letter-spacing: -0.1px;
  }
  .toolbar .brand .sub { color: var(--text-secondary); font-weight: 400; margin-left: 2px; }
  .toolbar .divider {
    width: 1px; height: 22px; background: var(--border-soft);
    margin: 0 14px;
  }
  .toolbar .grow { flex: 1; }
  .toolbar .stats-bar { display: flex; gap: 4px; }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px 5px 9px; border-radius: 5px;
    color: var(--text-secondary); font-size: 12.5px;
    cursor: default; white-space: nowrap; flex-shrink: 0;
    transition: background .12s, color .12s;
  }
  .toolbar .stats-bar { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: nowrap; align-items: center; }
  .stat-pill:hover { background: var(--bg-panel); color: var(--text-primary); }
  .stat-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 5px currentColor;
  }
  .stat-pill .v {
    color: var(--text-primary); font-weight: 600;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }
  .stat-pill.guides .dot     { color: var(--accent); background: currentColor; }
  .stat-pill.typologies .dot { color: var(--tag-blue); background: currentColor; }
  .stat-pill.cultures .dot   { color: var(--tag-green); background: currentColor; }
  .stat-pill.extras .dot     { color: var(--tag-amber); background: currentColor; }

  /* —— tabs —— */
  .tabs { display: flex; gap: 2px; height: 30px; align-items: center; }
  .tab {
    height: 26px; padding: 0 12px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text-secondary); font-size: 12.5px; font-weight: 500;
    cursor: pointer; background: transparent;
    border: 1px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
  }
  .tab:hover { color: var(--text-primary); background: var(--bg-panel); }
  .tab.active {
    color: var(--text-primary); background: var(--bg-elevated);
    border-color: var(--border-soft);
  }

  /* —— app shell —— */
  .app { display: grid; grid-template-columns: 280px 1fr 380px; overflow: hidden; min-height: 0; }
  .pane { overflow: auto; min-height: 0; }
  .pane.left  { background: var(--bg-base); border-right: 1px solid var(--border-mid); }
  .pane.right { background: var(--bg-base); border-left:  1px solid var(--border-mid); }

  /* —— left rail: culture groups + style guide rows —— */
  .rail-section { padding: 14px 0 6px; }
  .rail-h {
    font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700;
    padding: 4px 16px 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .rail-h .count {
    font-size: 10px; padding: 1px 6px;
    background: var(--bg-panel); border-radius: 8px;
    color: var(--text-secondary); font-weight: 500;
  }
  .culture-group { margin-bottom: 6px; }
  .culture-name {
    font-size: 11px; color: var(--text-secondary); font-weight: 600;
    padding: 8px 16px 4px; text-transform: capitalize;
    display: flex; align-items: center; gap: 6px;
  }
  .culture-name .swatch {
    width: 10px; height: 10px; border-radius: 2px;
    background: var(--accent);
  }
  .guide-row {
    padding: 7px 16px 7px 30px; cursor: pointer;
    border-left: 2px solid transparent;
    display: grid; grid-template-columns: 1fr auto; gap: 4px;
    align-items: baseline;
    transition: background .12s, border-color .12s, color .12s;
  }
  .guide-row:hover { background: var(--bg-panel); }
  .guide-row.active {
    background: var(--bg-elevated);
    border-left-color: var(--accent);
    color: var(--text-primary);
  }
  .guide-row .name {
    font-size: 12.5px; color: var(--text-primary); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .guide-row.active .name { color: var(--accent); font-weight: 600; }
  .guide-row .era {
    font-size: 10.5px; color: var(--text-muted);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }

  /* —— center pane: detail card + timeline + footprint catalogue —— */
  .center-wrap { padding: 22px 28px 60px; max-width: 880px; margin: 0 auto; }
  .detail-h1 {
    font-size: 22px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 4px; letter-spacing: -0.2px;
  }
  .detail-sub {
    color: var(--text-secondary); font-size: 13px; margin-bottom: 22px;
  }
  .detail-sub .culture-pill {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    background: var(--accent-dim); color: var(--text-accent);
    font-size: 11.5px; font-weight: 600; margin-right: 8px;
    text-transform: capitalize;
  }

  .panel {
    background: var(--bg-base); border: 1px solid var(--border-mid);
    border-radius: 6px; padding: 18px 20px; margin-bottom: 14px;
  }
  .panel-h {
    font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700; margin-bottom: 12px;
  }

  /* —— material + roof chips —— */
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 11px 6px 8px; border-radius: 4px;
    background: var(--bg-panel); border: 1px solid var(--border-soft);
    font-size: 12.5px;
  }
  .chip .swatch {
    width: 14px; height: 14px; border-radius: 2px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-hard);
  }
  .chip .label { color: var(--text-primary); font-weight: 500; }
  .chip .kind { color: var(--text-muted); font-size: 10.5px; font-weight: 600;
                text-transform: uppercase; letter-spacing: 0.5px; }

  /* —— extras grid —— */
  .extras { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .extras .k {
    color: var(--text-secondary); font-size: 11.5px;
    font-family: var(--font-mono); padding: 4px 0;
  }
  .extras .v {
    color: var(--text-primary); font-size: 12px; padding: 4px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .extras .v .arr-item {
    display: inline-block; padding: 1px 5px; margin-right: 3px;
    background: var(--bg-panel); border-radius: 2px;
    font-size: 10.5px; color: var(--text-secondary);
  }

  /* —— ornamentation tag list —— */
  .orn-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .orn-tag {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 9px 3px 3px; border-radius: 3px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    color: var(--text-secondary); font-size: 11.5px;
    font-family: var(--font-mono);
  }
  .orn-sphere {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
    background: var(--bg-deep);
  }

  /* —— material chip sphere preview —— */
  .chip .sphere-preview {
    width: 26px; height: 26px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
    background: var(--bg-deep);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  /* —— click-affordance for inspectable chips/tags —— */
  .chip-clickable { cursor: pointer; transition: border-color .12s, background .12s; }
  .chip-clickable:hover { border-color: var(--accent); background: var(--bg-elevated); }
  .chip-active {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 1px var(--accent-glow) inset;
  }

  /* —— inspector (right pane material/ornament editor) —— */
  .inspector { display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }
  .inspector-h {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-mid);
  }
  .inspector-back {
    background: transparent; border: 1px solid var(--border-soft);
    color: var(--text-secondary); cursor: pointer;
    padding: 4px 9px; border-radius: 4px;
    font: 11.5px var(--font-ui);
    transition: background .12s, color .12s, border-color .12s;
  }
  .inspector-back:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--accent); }
  .inspector-title { display: flex; flex-direction: column; }
  .inspector-name { font-size: 16px; font-weight: 600; text-transform: capitalize; color: var(--text-primary); }
  .inspector-sphere-wrap {
    background: radial-gradient(circle at 30% 30%, var(--bg-panel) 0%, var(--bg-deep) 80%);
    border: 1px solid var(--border-mid);
    border-radius: 6px;
    padding: 4px;
    aspect-ratio: 1; max-width: 100%;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45) inset;
  }
  .inspector-sphere-wrap canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    border-radius: 4px;
    cursor: grab;
  }
  .inspector-sphere-wrap canvas:active { cursor: grabbing; }
  .inspector-hint {
    font: 10px var(--font-mono); color: var(--text-muted);
    text-align: center; padding: 2px 0;
    letter-spacing: 0.3px;
  }
  .inspector-desc {
    font-size: 11.5px; color: var(--text-secondary);
    line-height: 1.55; padding: 0 2px;
  }
  .inspector-section { display: flex; flex-direction: column; gap: 7px; }
  .inspector-section-h {
    font-size: 10.5px; letter-spacing: 0.7px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border-mid);
  }
  .prop-grid {
    display: grid; grid-template-columns: max-content max-content 1fr;
    gap: 5px 12px; align-items: center;
    font-size: 11.5px;
  }
  .prop-k { color: var(--text-muted); font-family: var(--font-mono); }
  .prop-v { color: var(--text-primary); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .prop-bar {
    height: 5px; background: var(--bg-deep); border-radius: 2.5px;
    overflow: hidden; min-width: 60px;
  }
  .prop-bar-fill { display: block; height: 100%; background: var(--accent); }
  .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .map-tile {
    background: var(--bg-base); border: 1px solid var(--border-mid);
    border-radius: 4px; padding: 6px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .map-img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: 2px;
    image-rendering: -webkit-optimize-contrast;
  }
  .map-label {
    font: 10px var(--font-mono); color: var(--text-muted);
    text-align: center;
  }
  .inspector-foot {
    margin-top: 4px;
    font-size: 10px; text-align: center;
    padding: 6px 0;
    border-top: 1px solid var(--border-mid);
  }

  /* —— era timeline (horizontal bar w/ tick markers) —— */
  .timeline {
    position: relative; height: 56px; margin-top: 6px;
    background: linear-gradient(to right,
      transparent 0%, var(--bg-panel) 12%, var(--bg-panel) 88%, transparent 100%);
    border-radius: 3px;
  }
  .timeline .axis {
    position: absolute; left: 0; right: 0; top: 28px; height: 2px;
    background: var(--border-soft);
  }
  .timeline .seg {
    position: absolute; top: 19px; height: 18px;
    background: var(--accent-dim); border: 1px solid var(--accent);
    border-radius: 2px; cursor: pointer;
    transition: background .12s, transform .12s;
  }
  .timeline .seg:hover { background: var(--accent-glow); transform: translateY(-1px); }
  .timeline .seg.active {
    background: var(--accent); border-color: var(--accent-hover);
  }
  .timeline .seg.active::after {
    content: ''; position: absolute; top: -4px; left: 50%; width: 2px; height: 26px;
    background: var(--accent-hover); transform: translateX(-50%);
  }
  .timeline .tick {
    position: absolute; top: 38px; font-size: 10px;
    color: var(--text-muted); font-family: var(--font-mono);
    transform: translateX(-50%);
  }
  .timeline .seg-label {
    position: absolute; top: 0px; font-size: 10px;
    color: var(--text-secondary); font-weight: 600;
    transform: translateX(-50%);
  }

  /* —— right pane: typology weights bar chart + footprint —— */
  .right-wrap { padding: 22px 20px 60px; }
  .right-h {
    font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700; margin-bottom: 12px;
  }
  .weights-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 22px; }
  .weight-row {
    position: relative;
    display: grid; grid-template-columns: 1fr 32px;
    align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 3px;
    cursor: pointer; border: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .weight-row:hover { background: var(--bg-panel); }
  .weight-row.selected {
    background: var(--bg-elevated); border-color: var(--accent);
  }
  .weight-row .name {
    font-size: 12.5px; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    position: relative; z-index: 1;
    padding: 2px 0;
  }
  .weight-row .bar-bg {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(to right, var(--accent-dim), transparent);
    border-radius: 2px; z-index: 0; pointer-events: none;
  }
  .weight-row .col-name {
    position: relative; padding: 2px 6px; overflow: hidden;
  }
  .weight-row .col-w {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--text-secondary); font-size: 11.5px;
    text-align: right;
  }

  .footprint-card {
    background: var(--bg-deep); border: 1px solid var(--border-mid);
    border-radius: 6px; padding: 16px; margin-bottom: 14px;
  }
  .footprint-card .head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;
  }
  .footprint-card .typo-name {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    text-transform: capitalize;
  }
  .footprint-card .kind-pill {
    padding: 2px 7px; border-radius: 3px;
    background: var(--accent-dim); color: var(--text-accent);
    font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .footprint-svg {
    display: block; margin: 0 auto;
    background: var(--bg-deep);
  }
  .footprint-svg .lot      { fill: none; stroke: var(--border-soft); stroke-dasharray: 3 3; }
  .footprint-svg .building {
    fill: rgba(181, 106, 29, 0.22);    /* accent-dim, slightly stronger */
    stroke: var(--accent); stroke-width: 1.6;
  }
  .footprint-svg .window   {
    fill: var(--cream);
    stroke: var(--accent); stroke-width: 0.4;
    opacity: 0.92;
  }
  .footprint-svg .label    { fill: var(--text-muted); font-size: 9px; font-family: var(--font-mono); }

  .meta-row {
    display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px;
    margin-top: 10px;
    font-size: 11.5px;
  }
  .meta-row .k {
    color: var(--text-muted); font-family: var(--font-mono);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px;
    align-self: center;
  }
  .meta-row .v {
    color: var(--text-primary); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  /* —— footprint kind legend in the typologies view —— */
  .kind-legend {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  /* —— typologies view layout —— */
  .typologies-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .typology-card {
    background: var(--bg-base); border: 1px solid var(--border-mid);
    border-radius: 6px; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .typology-card .name {
    font-size: 14px; font-weight: 600; text-transform: capitalize;
  }

  .empty-state {
    color: var(--text-muted); text-align: center; padding: 40px 20px;
    font-style: italic;
  }

  /* —— bound elements panel —— */
  .bound-elements-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .bound-element-card {
    background: var(--bg-base); border: 1px solid var(--border-mid);
    border-radius: 6px; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .bound-element-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .bec-name { font-weight: 600; font-size: 13px; text-transform: capitalize; }
  .bec-thumb {
    background: var(--bg-deep); border-radius: 3px;
    height: 140px; display: flex; align-items: center; justify-content: center;
  }
  .bec-meta { font-size: 10.5px; }

  /* —— viewer modal —— */
  .viewer-modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
  .viewer-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
  .viewer-modal-card {
    position: relative; width: 720px; max-width: 90vw; max-height: 90vh;
    background: var(--bg-base); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .viewer-modal-h { display: flex; align-items: center; justify-content: space-between; }
  .viewer-modal-h span { font-size: 14px; font-weight: 600; }
  .viewer-modal-close {
    background: transparent; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 18px;
  }
  .viewer-stage {
    width: 100%; height: 480px; background: var(--bg-deep);
    border-radius: 4px;
  }
  .viewer-stats {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
  }

  /* —— settings button + settings modal —— */
  .settings-btn {
    height: 26px; padding: 0 10px;
    background: transparent; border: 1px solid var(--border-soft);
    color: var(--text-secondary); border-radius: 4px;
    font: 11.5px var(--font-ui); cursor: pointer;
    margin-left: 8px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .settings-btn:hover { background: var(--bg-panel); color: var(--text-primary); border-color: var(--accent); }
  .settings-label {
    font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 700; margin-bottom: 6px;
  }
  .settings-input {
    width: 100%; padding: 6px 10px;
    background: var(--bg-deep); color: var(--text-primary);
    border: 1px solid var(--border-soft); border-radius: 4px;
    font: 12px var(--font-mono); outline: none;
    transition: border-color .12s;
  }
  .settings-input:focus { border-color: var(--accent); }
  .settings-hint { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
  .settings-action {
    height: 28px; padding: 0 14px; border-radius: 4px;
    background: var(--bg-elevated); border: 1px solid var(--border-soft);
    color: var(--text-primary); font: 12px var(--font-ui); cursor: pointer;
  }
  .settings-action:hover { background: var(--bg-raised); border-color: var(--accent); }
  .settings-action-primary {
    background: var(--accent); color: #0e1219; border-color: var(--accent); font-weight: 600;
  }
  .settings-action-primary:hover { background: var(--accent-hover); }
  .bec-regen {
    align-self: flex-start; margin-top: 4px;
    background: transparent; border: 1px solid var(--border-soft);
    color: var(--text-secondary); padding: 3px 8px;
    border-radius: 3px; cursor: pointer;
    font: 10.5px var(--font-ui);
    transition: background .12s, color .12s, border-color .12s;
  }
  .bec-regen:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--accent); }
  .bec-regen:disabled { opacity: 0.5; cursor: wait; }

  /* —— Editor view —— */
  .editor-view {
    grid-column: 1 / -1;
    display: grid;
    grid-template-rows: 44px 1fr;
    overflow: hidden;
    background: var(--bg-deep);
  }
  .editor-topbar {
    background: var(--bg-base);
    border-bottom: 1px solid var(--border-mid);
    padding: 0 18px;
    display: flex; align-items: center; gap: 16px;
  }
  .editor-crumb { display: flex; align-items: center; gap: 8px; }
  .editor-crumb-prefix { font-size: 11px; }
  .editor-crumb-name { font-weight: 600; font-size: 13px; }
  .editor-slot-tabs { display: flex; flex: 1; gap: 0; align-self: flex-end; }
  .editor-slot-tab {
    padding: 8px 14px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-secondary);
    font: 12px var(--font-ui);
    cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .editor-slot-tab:hover { color: var(--text-primary); }
  .editor-slot-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .editor-slot-tab .dirty-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: 4px;
    vertical-align: middle;
  }
  .editor-save-btn {
    background: var(--bg-elevated);
    color: var(--text-muted);
    border: 1px solid var(--border-soft);
    padding: 6px 18px;
    font: 700 11px var(--font-ui);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: not-allowed;
    border-radius: 3px;
    transition: background .12s, color .12s;
  }
  .editor-save-btn:not(:disabled) {
    background: var(--accent);
    color: #0e1219;
    cursor: pointer;
    border-color: var(--accent);
  }
  .editor-save-btn:not(:disabled):hover { background: var(--accent-hover); }

  .editor-body {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    overflow: hidden;
  }
  .editor-canvas-wrap {
    background: var(--bg-deep);
    position: relative;
    overflow: hidden;
  }
  .editor-canvas-wrap canvas {
    width: 100%; height: 100%;
    display: block;
    background: var(--bg-deep);
    cursor: crosshair;
  }
  .editor-toolpalette {
    position: absolute;
    top: 10px; left: 10px;
    display: flex; flex-direction: column; gap: 4px;
    background: rgba(34, 38, 46, 0.92);
    padding: 4px; border-radius: 4px;
    border: 1px solid var(--border-soft);
    backdrop-filter: blur(8px);
    z-index: 5;
  }
  .editor-tool-btn {
    width: 30px; height: 30px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    border-radius: 3px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .editor-tool-btn:hover { background: var(--bg-panel); color: var(--text-primary); }
  .editor-tool-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }
  .editor-statusbar {
    position: absolute;
    bottom: 8px; left: 12px;
    font: 11px var(--font-mono);
    color: var(--text-muted);
    background: rgba(27, 30, 36, 0.7);
    padding: 4px 8px; border-radius: 3px;
    pointer-events: none;
    z-index: 5;
  }
  .editor-preview {
    background: var(--bg-base);
    border-left: 1px solid var(--border-mid);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .editor-preview-h {
    font: 700 10px var(--font-ui);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .editor-preview-stage {
    height: 240px;
    background: var(--bg-deep);
    border: 1px solid var(--border-mid);
    border-radius: 3px;
  }
  .editor-preview-stats { font-size: 10.5px; }
  .editor-preview-meta {
    font-size: 11px; color: var(--text-secondary); line-height: 1.6;
  }

  /* —— ✎ edit button on bound-element cards (used by Batch 6) —— */
  .bec-edit {
    align-self: flex-start; margin-top: 4px; margin-left: 6px;
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--text-secondary);
    padding: 3px 8px;
    border-radius: 3px;
    font: 10.5px var(--font-ui);
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .bec-edit:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--accent); }
</style>
</head>
<body>

<!-- ─── toolbar ───────────────────────────────────────────── -->
<div class="toolbar">
  <div class="brand-block">

    <div class="brand">Hayba <span class="sub">· Architecture Atlas</span></div>

  <div class="divider"></div>
  <div class="tabs" id="tabs">

  <div class="grow"></div>

<!-- ─── cultures studio shell ─────────────────────────────── -->
<div id="cultures-app" class="active">
  <aside class="studio-list">

    <ul id="culture-list"></ul>
  </aside>
  <main class="studio-main">
    <header id="culture-header" class="studio-header">
      <div class="studio-header-fields">

        <div class="studio-header-meta"><span id="culture-region">—</span> · <span id="culture-climate">—</span> · <span id="culture-counts">0 eras</span></div>
      </div>

<div id="viewerModal" class="viewer-modal" style="display:none;">
  <div class="viewer-modal-backdrop"></div>

      <button class="viewer-modal-close" id="viewerModalClose">✕</button>
    </div>

    <div id="viewerStats" class="viewer-stats"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

'use strict';

/* ─── data loading ─────────────────────────────────────── */

const GUIDE_FILES = [
  'medieval-european-carolingian',
  'medieval-european-romanesque',
  'medieval-european-gothic',
  'tang-chinese-7c',
  'tang-chinese-9c',
  'andean-pre-inca',
  'andean-inca',
  'edo-japanese-early',
  'edo-japanese-late',
  'hausa-classical',
  'industrial-revolution-english',
];

// Start with a dynamic listing from the server. If the listing endpoint is
// unavailable (e.g. the user is serving static files from a non-Hayba server),
// fall back to a hardcoded set so the page still works.
const FALLBACK_BOUND_PAIRS = [
  { styleSheetId: 'medieval-european-gothic', elementId: 'column' },
  { styleSheetId: 'medieval-european-gothic', elementId: 'cornice' },
  { styleSheetId: 'medieval-european-gothic', elementId: 'finial' },
];

let BOUND_PAIRS;
try {
  const list = await fetch('/api/bindings/list').then(r => r.json());
  BOUND_PAIRS = Array.isArray(list) && list.length > 0 ? list : FALLBACK_BOUND_PAIRS;
} catch {
  BOUND_PAIRS = FALLBACK_BOUND_PAIRS;
}


const [typologyFile, ...guides] = await Promise.all([
  fetch('../src/data/typologies.json').then(r => r.json()),
  ...GUIDE_FILES.map(n => fetch(`../src/data/style-guides/${n}.json`).then(r => r.json())),
]);

const bindings = {};
await Promise.all(BOUND_PAIRS.map(async ({ styleSheetId, elementId }) => {
  try {
    bindings[`${styleSheetId}::${elementId}`] =
      await fetch(`../src/bindings/${styleSheetId}/${elementId}.json`).then(r => r.json());
  } catch (err) {
    console.warn(`Failed to load binding ${styleSheetId}/${elementId}:`, err);
  }
}));

const typologies = typologyFile.typologies;
const typologyById = Object.fromEntries(typologies.map(t => [t.id, t]));
const guideById = Object.fromEntries(guides.map(g => [g.id, g]));

/* group guides by culture, sort by dateRange[0] */
const byCulture = new Map();
for (const g of guides) {
  const c = g.styleSheet.cultureId;
  if (!byCulture.has(c)) byCulture.set(c, []);
  byCulture.get(c).push(g);
}
for (const list of byCulture.values()) list.sort((a, b) => a.styleSheet.dateRange[0] - b.styleSheet.dateRange[0]);

/* count unique extras keys for the stats bar */
const extrasKeys = new Set();
for (const g of guides) for (const k of Object.keys(g.styleSheet.extras || {})) extrasKeys.add(k);

/* ─── state ─────────────────────────────────────────────── */

const state = {
  view: 'cultures',
  guideId: 'medieval-european-gothic',
  typologyId: null,
  // When set, the right pane displays a material-editor-style inspector
  // for that material or ornament instead of typology weights / across-cultures.
  inspecting: null,  // null | { kind: 'material' | 'ornament', id: string }
};

/* ─── stats bar ─────────────────────────────────────────── */

function renderStats() {
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat-pill guides"><span class="dot"></span><span>guides</span><span class="v">${guides.length}</span></div>
    <div class="stat-pill cultures"><span class="dot"></span><span>cultures</span><span class="v">${byCulture.size}</span></div>
    <div class="stat-pill typologies"><span class="dot"></span><span>typologies</span><span class="v">${typologies.length}</span></div>
  `;
}

/* ─── per-culture swatch color ──────────────────────────── */

const CULTURE_HUES = {
  'medieval-european': '#8a7654',
  'tang-chinese':      '#b85a4a',
  'andean':            '#a06a3e',
  'edo-japanese':      '#5a7e8a',
  'hausa':             '#c89060',
  'industrial-revolution-english': '#7e8a94',
};

function cultureLabel(id) {
  return id.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
}

/* ─── left rail (guides view) ────────────────────────────── */

function renderLeftPane() {
  const pane = document.getElementById('leftPane');
  if (state.view === 'guides') {
    let html = `<div class="rail-section">
      <div class="rail-h">Style guides <span class="count">${guides.length}</span></div>`;
    for (const [culture, list] of byCulture) {
      html += `<div class="culture-group">
        <div class="culture-name"><span class="swatch" style="background:${CULTURE_HUES[culture] ?? 'var(--accent)'}"></span>${cultureLabel(culture)}</div>`;
      for (const g of list) {
        const active = state.guideId === g.id ? 'active' : '';
        html += `<div class="guide-row ${active}" data-guide="${g.id}">
          <div class="name">${humanize(g.id, culture)}</div>
          <div class="era">${g.styleSheet.dateRange[0]}–${g.styleSheet.dateRange[1]}</div>
        </div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    pane.innerHTML = html;
    pane.querySelectorAll('.guide-row').forEach(el => {
      el.addEventListener('click', () => {
        state.guideId = el.dataset.guide;
        state.typologyId = null;
        renderLeftPane(); renderCenter(); renderRight();
      });
    });
  } else {
    /* typologies view: left rail lists typologies + the 5 footprint kinds as filters */
    let html = `<div class="rail-section">
      <div class="rail-h">Typologies <span class="count">${typologies.length}</span></div>`;
    for (const t of typologies) {
      const active = state.typologyId === t.id ? 'active' : '';
      html += `<div class="guide-row ${active}" data-typology="${t.id}">
        <div class="name">${humanize(t.id)}</div>
        <div class="era">${t.footprint.kind}</div>
      </div>`;
    }
    html += '</div>';
    pane.innerHTML = html;
    pane.querySelectorAll('.guide-row').forEach(el => {
      el.addEventListener('click', () => {
        state.typologyId = el.dataset.typology;
        renderLeftPane(); renderCenter(); renderRight();
      });
    });
  }
}

function humanize(id, culture) {
  // 'medieval-european-gothic' → 'Gothic' when grouped under culture 'medieval-european'
  let s = id;
  if (culture && id.startsWith(culture + '-')) s = id.slice(culture.length + 1);
  return s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

/* ─── center pane (guides view) ──────────────────────────── */

function renderCenter() {
  const wrap = document.getElementById('centerPane');
  if (state.view === 'guides') {
    const g = guideById[state.guideId];
    if (!g) { wrap.innerHTML = '<div class="empty-state">Pick a style guide on the left.</div>'; return; }
    const s = g.styleSheet;

    wrap.innerHTML = `
      <div class="detail-h1">${humanize(g.id, s.cultureId)}</div>
      <div class="detail-sub">
        <span class="culture-pill" style="background:${hexA(CULTURE_HUES[s.cultureId] ?? '#B56A1D',0.18)};color:${CULTURE_HUES[s.cultureId] ?? 'var(--text-accent)'}">${cultureLabel(s.cultureId)}</span>
        <span class="mono">${s.dateRange[0]}–${s.dateRange[1]}</span>
        <span class="muted"> · ${g.typologyWeights.length} typologies in palette</span>
      </div>

      <div class="panel">
        <div class="panel-h">Era timeline · ${cultureLabel(s.cultureId)}</div>
        ${renderTimeline(s.cultureId, g.id)}
      </div>

      <div class="panel">
        <div class="panel-h">Core style</div>
        <div class="chip-row" style="margin-bottom:14px;">
          ${materialChip('primary', s.core.primaryMaterial)}
          ${s.core.secondaryMaterial ? materialChip('secondary', s.core.secondaryMaterial) : ''}
          ${roofChip(s.core.roofType)}
        </div>
        <div class="panel-h" style="margin-top:18px;">Ornamentation</div>
        <div class="orn-list">
          ${s.core.ornamentation.map(o => {
            const a = state.inspecting && state.inspecting.kind === 'ornament' && state.inspecting.id === o;
            return `<span class="orn-tag chip-clickable ${a ? 'chip-active' : ''}" data-inspect-ornament="${o}" title="Click to inspect"><img class="orn-sphere" src="${getOrnamentPreviewUrl(o)}" alt="${o}">${o}</span>`;
          }).join('') || '<span class="muted">—</span>'}
        </div>
      </div>

      <div class="panel">
        <div class="panel-h">Extras · ${Object.keys(s.extras || {}).length} key${Object.keys(s.extras || {}).length !== 1 ? 's' : ''}</div>
        ${renderExtras(s.extras)}
      </div>

      ${BOUND_PAIRS.filter(p => p.styleSheetId === g.id).length === 0 ? '' : `
        <div class="panel">
          <div class="panel-h">Bound elements · ${BOUND_PAIRS.filter(p => p.styleSheetId === g.id).length}</div>
          <div class="bound-elements-grid">
            ${BOUND_PAIRS.filter(p => p.styleSheetId === g.id).map(p => {
              const b = bindings[`${p.styleSheetId}::${p.elementId}`];
              return `
                <div class="bound-element-card" data-element="${p.elementId}" data-style="${p.styleSheetId}">
                  <div class="bec-name">${humanize(p.elementId)}</div>
                  <div class="bec-thumb">
                    <span class="muted" style="font-size:11px;">click to view 3D</span>
                  </div>
                  <div class="bec-meta">
                    <span class="mono muted">${Object.entries(b.params).slice(0, 2).map(([k, v]) => `${k.replace(/_m$/,'')} ${v}`).join(' · ')} · seed ${String(b.seed).slice(0, 10)}…</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `}
    `;
    wrap.querySelectorAll('.timeline .seg').forEach(el => {
      el.addEventListener('click', () => {
        state.guideId = el.dataset.guide;
        renderLeftPane(); renderCenter(); renderRight();
      });
    });
  } else {
    /* typologies view: gallery of typology cards */
    wrap.innerHTML = `
      <div class="detail-h1">Typology catalogue</div>
      <div class="detail-sub">10 culture-agnostic structural archetypes. Each is dressed by a StyleSheet to become a real building.</div>
      <div class="typologies-grid">
        ${typologies.map(t => `
          <div class="typology-card" data-typology="${t.id}" style="cursor:pointer;${state.typologyId === t.id ? 'border-color:var(--accent);' : ''}">
            ${footprintSvg(t, 200, 130)}
            <div class="name">${humanize(t.id)}</div>
            <div class="meta-row">
              <span class="k">Kind</span>     <span class="v">${t.footprint.kind}</span>
              <span class="k">Stories</span>  <span class="v">${t.storyRange[0]}–${t.storyRange[1]}</span>
              <span class="k">Windows</span>  <span class="v">${pct(t.fenestrationDensity[0])}–${pct(t.fenestrationDensity[1])}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    wrap.querySelectorAll('.typology-card').forEach(el => {
      el.addEventListener('click', () => {
        state.typologyId = el.dataset.typology;
        renderLeftPane(); renderCenter(); renderRight();
      });
    });
  }
}

function pct(n) { return (n * 100).toFixed(0) + '%'; }

function renderExtras(extras) {
  const keys = Object.keys(extras || {});
  if (!keys.length) return '<div class="muted">No culture-specific extras.</div>';
  let html = '<div class="extras">';
  for (const k of keys) {
    const v = extras[k];
    let rendered;
    if (Array.isArray(v)) {
      rendered = v.map(x => `<span class="arr-item">${x}</span>`).join('');
    } else {
      rendered = `<span class="mono">${v}</span>`;
    }
    html += `<div class="k">${k}</div><div class="v">${rendered}</div>`;
  }
  html += '</div>';
  return html;
}

/* ─── timeline (horizontal era ribbon for a culture) ────── */

function renderTimeline(cultureId, activeGuideId) {
  const list = byCulture.get(cultureId);
  if (!list || !list.length) return '';
  const minY = Math.min(...list.map(g => g.styleSheet.dateRange[0]));
  const maxY = Math.max(...list.map(g => g.styleSheet.dateRange[1]));
  const span = Math.max(maxY - minY, 1);
  const padFrac = 0.06;
  const w = 100;  // % units
  const inner = w * (1 - 2 * padFrac);
  let html = `<div class="timeline">
    <div class="axis"></div>`;
  for (const g of list) {
    const dr = g.styleSheet.dateRange;
    const leftPct  = padFrac * 100 + ((dr[0] - minY) / span) * inner;
    const widthPct = ((dr[1] - dr[0]) / span) * inner;
    const active = activeGuideId === g.id ? 'active' : '';
    const label = humanize(g.id, cultureId);
    html += `<div class="seg ${active}" data-guide="${g.id}"
                  title="${label}: ${dr[0]}–${dr[1]}"
                  style="left:${leftPct}%; width:${Math.max(widthPct, 2)}%;"></div>`;
    if (active) {
      html += `<div class="seg-label" style="left:${leftPct + widthPct/2}%;">${label}</div>`;
    }
  }
  /* axis tick labels (start, mid, end) */
  const midY = Math.round((minY + maxY) / 2);
  html += `<div class="tick" style="left:${padFrac * 100}%;">${minY}</div>`;
  html += `<div class="tick" style="left:50%;">${midY}</div>`;
  html += `<div class="tick" style="left:${(1 - padFrac) * 100}%;">${maxY}</div>`;
  html += `</div>`;
  return html;
}

/* ─── footprint SVG per kind ──────────────────────────────── */

function footprintSvg(t, w, h) {
  const fp = t.footprint;
  const pad = 16;
  const W = w - 2*pad, H = h - 2*pad;

  let buildingPath = '';
  let inner = '';
  let aspectNote = '';

  if (fp.kind === 'rectangle') {
    const ar = mid(fp.aspectRatio);
    const { rw, rh } = fitToBox(ar, W, H);
    const x = pad + (W - rw) / 2, y = pad + (H - rh) / 2;
    buildingPath = `M ${x},${y} h ${rw} v ${rh} h ${-rw} z`;
    aspectNote = `aspect ${ar.toFixed(2)}`;
    inner = windowDots(x, y, rw, rh, t.fenestrationDensity);
  } else if (fp.kind === 'linear-row') {
    const wid = mid(fp.widthRange), dep = mid(fp.depthRange);
    const ar = wid / dep;
    const { rw, rh } = fitToBox(ar, W, H);
    const x = pad + (W - rw) / 2, y = pad + (H - rh) / 2;
    buildingPath = `M ${x},${y} h ${rw} v ${rh} h ${-rw} z`;
    aspectNote = `${dep.toFixed(1)}×${wid.toFixed(1)}m`;
    inner = windowDots(x, y, rw, rh, t.fenestrationDensity);
  } else if (fp.kind === 'L-shape') {
    const cf = mid(fp.courtyardFraction);
    const { rw, rh } = fitToBox(1.0, W, H);
    const x = pad + (W - rw) / 2, y = pad + (H - rh) / 2;
    const cut = cf;
    // L = full rect with top-right square cut out
    buildingPath = `
      M ${x},${y}
      h ${rw * (1-cut)}
      v ${rh * cut}
      h ${rw * cut}
      v ${rh * (1-cut)}
      h ${-rw}
      z
    `.replace(/\s+/g, ' ').trim();
    aspectNote = `courtyard ${pct(cf)}`;
  } else if (fp.kind === 'U-shape') {
    const ow = mid(fp.openingWidth), wd = mid(fp.wingDepth);
    const { rw, rh } = fitToBox(1.0, W, H);
    const x = pad + (W - rw) / 2, y = pad + (H - rh) / 2;
    // proportional wing depth and opening width relative to rw/rh
    const wf = Math.min(0.35, wd / 30);
    const of = Math.min(0.65, ow / 20);
    const sideW = rw * wf;
    const openW = rw * of;
    const restW = rw - 2*sideW - openW;
    const baseH = rh * (1 - wf);
    buildingPath = `
      M ${x},${y}
      h ${sideW}
      v ${rh - baseH - (rh*wf)}
    `;
    // Cleaner U with explicit anchors:
    const innerLeft  = x + sideW;
    const innerRight = x + sideW + openW + sideW;  // ignore restW for clean U
    // Recompute: U has three sides — left wing, bottom base, right wing
    const leftWingX  = x;
    const leftWingW  = rw * wf;
    const rightWingW = rw * wf;
    const rightWingX = x + rw - rightWingW;
    const openingW   = rw - leftWingW - rightWingW;
    const wingDepthY = rh * (1 - wf);
    buildingPath = `
      M ${leftWingX},${y}
      h ${leftWingW}
      v ${wingDepthY}
      h ${openingW}
      v ${-wingDepthY}
      h ${rightWingW}
      v ${rh}
      h ${-rw}
      z
    `.replace(/\s+/g, ' ').trim();
    aspectNote = `opening ${ow.toFixed(0)}m`;
  } else if (fp.kind === 'courtyard') {
    const cf = mid(fp.courtyardFraction);
    const { rw, rh } = fitToBox(1.1, W, H);
    const x = pad + (W - rw) / 2, y = pad + (H - rh) / 2;
    const innerW = rw * Math.sqrt(cf), innerH = rh * Math.sqrt(cf);
    const ix = x + (rw - innerW) / 2, iy = y + (rh - innerH) / 2;
    // Outer ring as building, inner courtyard as hole (use evenodd)
    buildingPath = `
      M ${x},${y} h ${rw} v ${rh} h ${-rw} z
      M ${ix},${iy} h ${innerW} v ${innerH} h ${-innerW} z
    `.replace(/\s+/g, ' ').trim();
    aspectNote = `inner court ${pct(cf)}`;
  }

  return `
    <svg class="footprint-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <rect class="lot" x="${pad/2}" y="${pad/2}" width="${w - pad}" height="${h - pad}" rx="2"/>
      <path class="building" d="${buildingPath}" fill-rule="evenodd"/>
      ${inner}
      <text class="label" x="${w/2}" y="${h - 3}" text-anchor="middle">${aspectNote}</text>
    </svg>
  `;
}

function mid([lo, hi]) { return (lo + hi) / 2; }

function fitToBox(aspect, W, H) {
  let rw = W, rh = W / aspect;
  if (rh > H) { rh = H; rw = H * aspect; }
  return { rw, rh };
}

function windowDots(x, y, w, h, density) {
  // Edge-aligned window slits on the building perimeter, sized as a fraction
  // of the building so they stay visible at any zoom level. Higher density
  // produces more windows (smaller gap).
  const d = mid(density);
  if (d <= 0) return '';
  const minSide = Math.min(w, h);
  const slitDepth  = Math.max(3, minSide * 0.07);   // perpendicular to the edge
  const slitLength = Math.max(6, minSide * 0.13);   // along the edge
  const inset      = Math.max(2, minSide * 0.045);  // distance from wall
  const baseGap    = Math.max(slitLength * 1.1, minSide * 0.18);
  const gap = baseGap * (0.04 / Math.max(d, 0.04));

  const slits = [];
  for (let cx = x + gap; cx + slitLength < x + w - gap; cx += gap + slitLength) {
    slits.push({ x: cx, y: y + inset, w: slitLength, h: slitDepth });
    slits.push({ x: cx, y: y + h - inset - slitDepth, w: slitLength, h: slitDepth });
  }
  for (let cy = y + gap; cy + slitLength < y + h - gap; cy += gap + slitLength) {
    slits.push({ x: x + inset, y: cy, w: slitDepth, h: slitLength });
    slits.push({ x: x + w - inset - slitDepth, y: cy, w: slitDepth, h: slitLength });
  }

  return slits
    .map(s => `<rect class="window" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="0.5"/>`)
    .join('');
}

/* ─── inspector (material / ornament editor) ──────────────────────────────── */

let _inspectorTeardown = null;

function teardownInspectorSphere() {
  if (_inspectorTeardown) {
    try { _inspectorTeardown(); } catch (_) { /* swallow */ }
    _inspectorTeardown = null;
  }
}

function mountLiveSphere(container, material) {
  teardownInspectorSphere();
  container.innerHTML = '';

  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 10);
  camera.position.set(0, 0.15, 3.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const updateSize = () => {
    const w = Math.max(80, container.clientWidth);
    const h = Math.max(80, container.clientHeight || w);
    renderer.setSize(w, h, true);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  container.appendChild(renderer.domElement);
  updateSize();

  // Match the cached preview lighting.
  const key = new THREE.DirectionalLight(0xfff2dd, 1.7);
  key.position.set(1.4, 1.6, 2.0); scene.add(key);
  const fill = new THREE.DirectionalLight(0xa0b0c4, 0.55);
  fill.position.set(-1.4, 0.6, -0.8); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.25);
  rim.position.set(0, -1.2, -2.0); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.10));

  const geo = new THREE.SphereGeometry(1, 64, 64);
  const sphere = new THREE.Mesh(geo, material);
  scene.add(sphere);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);
  controls.minDistance = 2.6;
  controls.maxDistance = 6;
  controls.enablePan = false;
  controls.rotateSpeed = 0.7;

  let stopped = false;
  let rafId = 0;
  const animate = () => {
    if (stopped) return;
    rafId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  };
  animate();

  let ro = null;
  if (typeof ResizeObserver !== 'undefined') {
    ro = new ResizeObserver(updateSize);
    ro.observe(container);
  }

  _inspectorTeardown = () => {
    stopped = true;
    cancelAnimationFrame(rafId);
    if (ro) ro.disconnect();
    controls.dispose();
    geo.dispose();
    if (material.map)        material.map.dispose();
    if (material.normalMap)  material.normalMap.dispose();
    material.dispose();
    renderer.dispose();
    renderer.forceContextLoss?.();
    if (renderer.domElement.parentNode === container) {
      container.removeChild(renderer.domElement);
    }
  };
}

function renderInspector(wrap) {
  const insp = state.inspecting;
  if (!insp) { teardownInspectorSphere(); wrap.innerHTML = ''; return; }
  if (insp.kind === 'material') {

/* ─── right pane (typology weights for the active guide, or footprint detail) ── */

function renderRight() {
  const wrap = document.getElementById('rightWrap');

  // Inspector mode takes precedence over the default right-pane views.
  if (state.inspecting) {
    renderInspector(wrap);
    return;
  }

  // Leaving inspector → tear down live sphere if it was mounted.
  teardownInspectorSphere();

  if (state.view === 'guides') {
    const g = guideById[state.guideId];
    if (!g) { wrap.innerHTML = ''; return; }
    const maxW = Math.max(...g.typologyWeights.map(w => w.weight));
    const sortedWeights = [...g.typologyWeights].sort((a, b) => b.weight - a.weight);
    let html = `<div class="right-h">Typology weights</div><div class="weights-list">`;
    for (const w of sortedWeights) {
      const sel = state.typologyId === w.typologyId ? 'selected' : '';
      const pct = (w.weight / maxW) * 100;
      html += `<div class="weight-row ${sel}" data-typology="${w.typologyId}">
        <div class="bar-bg" style="width:${pct}%"></div>
        <div class="col-name">${humanize(w.typologyId)}</div>
        <div class="col-w">${w.weight}</div>
      </div>`;
    }
    html += '</div>';
    /* footprint detail card */
    const tid = state.typologyId ?? sortedWeights[0]?.typologyId;
    if (tid && typologyById[tid]) {
      const t = typologyById[tid];
      html += `<div class="footprint-card">
        <div class="head">
          <div class="typo-name">${humanize(t.id)}</div>
          <span class="kind-pill">${t.footprint.kind}</span>
        </div>
        ${footprintSvg(t, 340, 200)}
        <div class="meta-row">
          <span class="k">Stories</span>          <span class="v">${t.storyRange[0]}–${t.storyRange[1]}</span>
          <span class="k">Fenestration</span>     <span class="v">${pctRange(t.fenestrationDensity)}</span>
          ${footprintParamRow(t.footprint)}
        </div>
        <div style="margin-top:12px;font-size:11px;color:var(--text-muted);line-height:1.5;">
          Dressed by <span class="accent">${humanize(g.id, g.styleSheet.cultureId)}</span> → walls in ${matSpan(g.styleSheet.core.primaryMaterial)}, ${g.styleSheet.core.roofType} roof.
        </div>
      </div>`;
    }
    wrap.innerHTML = html;
    wrap.querySelectorAll('.weight-row').forEach(el => {
      el.addEventListener('click', () => {
        state.typologyId = el.dataset.typology;
        renderRight();
      });
    });
  } else {
    /* typologies view: show every culture/era dressing of the selected typology */
    if (!state.typologyId) { wrap.innerHTML = '<div class="empty-state">Pick a typology.</div>'; return; }
    const t = typologyById[state.typologyId];
    let html = `<div class="right-h">${humanize(t.id)} across cultures</div>`;
    for (const g of guides) {
      const weight = g.typologyWeights.find(w => w.typologyId === t.id)?.weight;
      if (!weight) continue;
      const s = g.styleSheet;
      html += `<div class="footprint-card">
        <div class="head">
          <div class="typo-name" style="font-size:12.5px;">${humanize(g.id, s.cultureId)}</div>
          <span class="kind-pill" style="background:${hexA(CULTURE_HUES[s.cultureId] ?? '#B56A1D', 0.18)};color:${CULTURE_HUES[s.cultureId] ?? 'var(--text-accent)'}">${cultureLabel(s.cultureId)}</span>
        </div>
        <div style="font-size:11.5px;line-height:1.6;">
          <span class="muted">walls</span> ${matSpan(s.core.primaryMaterial)}
          ${s.core.secondaryMaterial ? `<span class="muted">+ </span>${matSpan(s.core.secondaryMaterial)}` : ''}
          <br><span class="muted">roof</span> ${s.core.roofType}
          <br><span class="muted">weight</span> <span class="mono">${weight}</span>
          · <span class="muted">${s.dateRange[0]}–${s.dateRange[1]}</span>
        </div>
      </div>`;
    }
    wrap.innerHTML = html;
  }
}

function matSpan(m) {
  return `<span style="color:var(--mat-${m});font-weight:500;">${m}</span>`;
}
function pctRange([lo, hi]) {
  return `${(lo*100).toFixed(0)}%–${(hi*100).toFixed(0)}%`;
}
function footprintParamRow(fp) {
  // surface kind-specific params in the meta row
  const rows = [];
  if (fp.kind === 'rectangle') {
    rows.push(['Aspect', `${fp.aspectRatio[0]}–${fp.aspectRatio[1]}`]);
    rows.push(['Area',   `${fp.areaRange[0]}–${fp.areaRange[1]} m²`]);
  } else if (fp.kind === 'linear-row') {
    rows.push(['Width', `${fp.widthRange[0]}–${fp.widthRange[1]} m`]);
    rows.push(['Depth', `${fp.depthRange[0]}–${fp.depthRange[1]} m`]);
  } else if (fp.kind === 'L-shape' || fp.kind === 'courtyard') {
    rows.push(['Wing depth', `${fp.wingDepth[0]}–${fp.wingDepth[1]} m`]);
    rows.push(['Courtyard',  `${pct(fp.courtyardFraction[0])}–${pct(fp.courtyardFraction[1])}`]);
  } else if (fp.kind === 'U-shape') {
    rows.push(['Wing depth',   `${fp.wingDepth[0]}–${fp.wingDepth[1]} m`]);
    rows.push(['Opening',      `${fp.openingWidth[0]}–${fp.openingWidth[1]} m`]);
  }
  return rows.map(([k, v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('');
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0,2), 16), g = parseInt(h.slice(2,4), 16), b = parseInt(h.slice(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

/* ─── kernel + 3D viewer ─────────────────────────────────── */

async function loadKernel() {
  try {
    const mod = await import('../dist/index.js');
    return mod;
  } catch (e) {
    console.error('Kernel import failed (did you run `npm run build`?):', e);
    return null;
  }
}

const kernelMod = await loadKernel();


function emitGLBForBinding(styleSheetId, elementId) {
  if (!kernelMod) throw new Error('Kernel not loaded — run `npm run build --workspace=@hayba/architecture`');
  const result = kernelMod.emitElementMesh(styleSheetId, elementId);
  if (!result.ok) throw new Error(result.message);
  return result;
}

/* —— procedural stone texture + normal map (CanvasTexture, no external assets) —— */
function makeStoneTexture(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  // Base warm-grey
  ctx.fillStyle = '#a89c8a';
  ctx.fillRect(0, 0, size, size);
  // Stochastic stippling for surface noise
  const id = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < id.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 36;
    id.data[i]     = Math.max(0, Math.min(255, id.data[i]     + n));
    id.data[i + 1] = Math.max(0, Math.min(255, id.data[i + 1] + n * 0.95));
    id.data[i + 2] = Math.max(0, Math.min(255, id.data[i + 2] + n * 0.85));
  }
  ctx.putImageData(id, 0, 0);
  // Soft veining (a few low-opacity strokes)
  ctx.strokeStyle = 'rgba(70, 60, 50, 0.18)';
  ctx.lineWidth = 1.2;
  for (let k = 0; k < 30; k++) {
    ctx.beginPath();
    ctx.moveTo(Math.random() * size, Math.random() * size);
    for (let s = 0; s < 5; s++) {
      ctx.lineTo(Math.random() * size, Math.random() * size);
    }
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 4);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeStoneNormalMap(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  // Compute a tiny height field from noise, then convert to normals.
  const h = new Float32Array(size * size);
  for (let i = 0; i < h.length; i++) h[i] = Math.random();
  // Blur (3x3 box) once for smoother normals
  const blurred = new Float32Array(h.length);
  for (let y = 1; y < size - 1; y++) {
    for (let x = 1; x < size - 1; x++) {
      let s = 0;
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++)
          s += h[(y + dy) * size + (x + dx)];
      blurred[y * size + x] = s / 9;
    }
  }
  const id = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      const xL = blurred[Math.max(0, y * size + (x - 1))] ?? 0.5;
      const xR = blurred[Math.min(size - 1, y * size + (x + 1))] ?? 0.5;
      const yD = blurred[Math.max(0, (y - 1) * size + x)] ?? 0.5;
      const yU = blurred[Math.min(size - 1, (y + 1) * size + x)] ?? 0.5;
      const dx = (xR - xL) * 4;
      const dy = (yU - yD) * 4;
      const dz = 1;
      const len = Math.hypot(dx, dy, dz) || 1;
      const r = ((-dx / len) * 0.5 + 0.5) * 255;
      const g = ((-dy / len) * 0.5 + 0.5) * 255;
      const b = ((dz / len) * 0.5 + 0.5) * 255;
      id.data[i * 4]     = r;
      id.data[i * 4 + 1] = g;
      id.data[i * 4 + 2] = b;
      id.data[i * 4 + 3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 4);
  return t;
}

let STONE_DIFFUSE_TEXTURE = null;
let STONE_NORMAL_TEXTURE = null;
function getStoneMaterial() {
  if (!STONE_DIFFUSE_TEXTURE) STONE_DIFFUSE_TEXTURE = makeStoneTexture();
  if (!STONE_NORMAL_TEXTURE)  STONE_NORMAL_TEXTURE  = makeStoneNormalMap();
  return new THREE.MeshStandardMaterial({
    map: STONE_DIFFUSE_TEXTURE,
    normalMap: STONE_NORMAL_TEXTURE,
    normalScale: new THREE.Vector2(0.7, 0.7),
    roughness: 0.92,
    metalness: 0.02,
  });
}

function openViewer(styleSheetId, elementId) {
  document.getElementById('viewerModal').style.display = 'flex';
  document.getElementById('viewerModalTitle').textContent = `${humanize(elementId)} · ${cultureLabel(styleSheetId)}`;
  const stage = document.getElementById('viewerStage');
  stage.innerHTML = '';
  const stats = document.getElementById('viewerStats');
  stats.textContent = 'loading…';

  let result;
  try {
    result = emitGLBForBinding(styleSheetId, elementId);
  } catch (e) {
    stage.innerHTML = `<div style="padding:24px;color:var(--status-red);">Kernel error: ${e.message}</div>`;
    return;
  }
  stats.textContent = `triangles ${result.stats.triangles} · vertices ${result.stats.vertices} · ${(result.stats.sizeBytes/1024).toFixed(1)} KB`;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1e24);
  const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.01, 100);
  camera.position.set(2.5, 3, 4);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  stage.appendChild(renderer.domElement);

  const keyLight = new THREE.DirectionalLight(0xfff2dd, 1.6);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xa0b0c4, 0.6);
  fillLight.position.set(-4, 3, -2);
  scene.add(fillLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.18));
  const grid = new THREE.GridHelper(10, 10, 0x3d434e, 0x2a2e36);
  scene.add(grid);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const loader = new GLTFLoader();
  loader.parse(result.glb, '', (gltf) => {
    const stoneMat = getStoneMaterial();
    gltf.scene.traverse((o) => {
      if (o.isMesh) o.material = stoneMat;
    });
    scene.add(gltf.scene);
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z, 0.5);
    camera.position.set(center.x + maxDim * 1.6, center.y + maxDim * 0.6, center.z + maxDim * 1.6);
    controls.target.copy(center);
    controls.update();
  }, (err) => {
    stage.innerHTML = `<div style="padding:24px;color:var(--status-red);">GLB load error: ${err}</div>`;
  });

  (function animate() {
    if (document.getElementById('viewerModal').style.display === 'none') return;
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

document.getElementById('viewerModalClose').addEventListener('click', () => {
  document.getElementById('viewerModal').style.display = 'none';
  document.getElementById('viewerStage').innerHTML = '';
});


document.addEventListener('click', (e) => {
  const card = e.target.closest('.bound-element-card');
  if (card) { openViewer(card.dataset.style, card.dataset.element); return; }

  // Material / ornament inspector — click any chip / orn-tag with a data-inspect-* attribute.
  const matEl = e.target.closest('[data-inspect-material]');
  if (matEl) {
    state.inspecting = { kind: 'material', id: matEl.dataset.inspectMaterial };
    renderCenter(); renderRight();
    return;
  }
  const ornEl = e.target.closest('[data-inspect-ornament]');
  if (ornEl) {
    state.inspecting = { kind: 'ornament', id: ornEl.dataset.inspectOrnament };
    renderCenter(); renderRight();
    return;
  }
});

/* ─── PBR sphere material previews ──────────────────────────
 * Pre-renders a small (96 px) sphere preview for each material + each
 * ornament tag at app boot. Uses a single shared three.js renderer +
 * scene + sphere mesh; swap the material between renders and capture
 * each frame to a data URL. Cached forever for the session.
 *
 * Each preview is a real-PBR render — diffuse + normal map procedurally
 * generated from canvas noise / hatching / pattern primitives. No external
 * texture assets; everything ships in this single HTML.
 */

const PREVIEW_SIZE = 96;
let _previewRenderer = null;
let _previewScene = null;
let _previewCamera = null;
let _previewSphere = null;

function _setupPreviewer() {
  if (_previewRenderer) return;
  _previewRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
  _previewRenderer.setSize(PREVIEW_SIZE, PREVIEW_SIZE);
  _previewRenderer.setPixelRatio(2);
  _previewRenderer.outputColorSpace = THREE.SRGBColorSpace;

  _previewScene = new THREE.Scene();
  _previewCamera = new THREE.PerspectiveCamera(28, 1, 0.1, 10);
  _previewCamera.position.set(0, 0.15, 3.6);
  _previewCamera.lookAt(0, 0, 0);

  const key = new THREE.DirectionalLight(0xfff2dd, 1.7);
  key.position.set(1.4, 1.6, 2.0);
  _previewScene.add(key);
  const fill = new THREE.DirectionalLight(0xa0b0c4, 0.55);
  fill.position.set(-1.4, 0.6, -0.8);
  _previewScene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.25);
  rim.position.set(0, -1.2, -2.0);
  _previewScene.add(rim);
  _previewScene.add(new THREE.AmbientLight(0xffffff, 0.10));

  _previewSphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 48),
    new THREE.MeshStandardMaterial(),
  );
  _previewScene.add(_previewSphere);
}

function _renderSphereWithMaterial(material, size = PREVIEW_SIZE) {
  _setupPreviewer();
  if (_previewRenderer.domElement.width !== size * 2) {
    _previewRenderer.setSize(size, size);
  }
  _previewSphere.material = material;
  _previewRenderer.render(_previewScene, _previewCamera);
  return _previewRenderer.domElement.toDataURL('image/png');
}

/* ── procedural canvas pattern generators ── */

function _noisyFill(ctx, size, baseColor, jitter) {
  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, size, size);
  const id = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < id.data.length; i += 4) {
    const n = (Math.random() - 0.5) * jitter;
    id.data[i]     = Math.max(0, Math.min(255, id.data[i]     + n));
    id.data[i + 1] = Math.max(0, Math.min(255, id.data[i + 1] + n * 0.95));
    id.data[i + 2] = Math.max(0, Math.min(255, id.data[i + 2] + n * 0.9));
  }
  ctx.putImageData(id, 0, 0);
}

function _heightToNormal(heights, size, strength = 4) {
  const out = new Uint8ClampedArray(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const xL = heights[y * size + Math.max(0, x - 1)];
      const xR = heights[y * size + Math.min(size - 1, x + 1)];
      const yD = heights[Math.max(0, y - 1) * size + x];
      const yU = heights[Math.min(size - 1, y + 1) * size + x];
      const dx = (xR - xL) * strength;
      const dy = (yU - yD) * strength;
      const dz = 1;
      const len = Math.hypot(dx, dy, dz) || 1;
      const i = (y * size + x) * 4;
      out[i]     = ((-dx / len) * 0.5 + 0.5) * 255;
      out[i + 1] = ((-dy / len) * 0.5 + 0.5) * 255;
      out[i + 2] = ((dz / len) * 0.5 + 0.5) * 255;
      out[i + 3] = 255;
    }
  }
  return out;
}

function _normalFromHeightFn(nctx, size, heightFn, strength = 4) {
  const heights = new Float32Array(size * size);
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      heights[y * size + x] = heightFn(x / size, y / size);
  const buf = _heightToNormal(heights, size, strength);
  const id = new ImageData(buf, size, size);
  nctx.putImageData(id, 0, 0);
}

function _paintMaterial(materialId, dctx, nctx, size) {
  switch (materialId) {
    case 'stone': {
      _noisyFill(dctx, size, '#9aa0a8', 50);
      // Subtle banding
      dctx.fillStyle = 'rgba(70, 65, 60, 0.07)';
      for (let i = 0; i < 4; i++) dctx.fillRect(0, Math.random() * size, size, 2 + Math.random() * 4);
      _normalFromHeightFn(nctx, size, () => Math.random(), 3.5);
      break;
    }
    case 'timber': {
      // Vertical wood grain
      for (let x = 0; x < size; x++) {
        const t = (x / size) * 11;
        const grain = Math.sin(t * 2) * 0.4 + Math.sin(t * 5.3 + 1) * 0.15 + (Math.random() - 0.5) * 0.18;
        const base = 152 + grain * 32;
        dctx.fillStyle = `rgb(${Math.round(base + 32)}, ${Math.round(base - 10)}, ${Math.round(base - 42)})`;
        dctx.fillRect(x, 0, 1, size);
      }
      // dark streaks
      for (let k = 0; k < 4; k++) {
        const x0 = Math.random() * size;
        dctx.strokeStyle = 'rgba(60, 35, 18, 0.42)';
        dctx.lineWidth = 0.6 + Math.random() * 1.5;
        dctx.beginPath();
        dctx.moveTo(x0, 0);
        for (let y = 0; y <= size; y += 8) dctx.lineTo(x0 + (Math.random() - 0.5) * 6, y);
        dctx.stroke();
      }
      _normalFromHeightFn(nctx, size, (u, v) => 0.5 + Math.sin(u * 70) * 0.35 + (Math.random() - 0.5) * 0.05, 5);
      break;
    }
    case 'mudbrick': {
      _noisyFill(dctx, size, '#a06a3e', 32);
      // hairline cracks
      dctx.strokeStyle = 'rgba(40, 20, 10, 0.45)';
      dctx.lineWidth = 0.8;
      for (let i = 0; i < 14; i++) {
        dctx.beginPath();
        dctx.moveTo(Math.random() * size, Math.random() * size);
        for (let s = 0; s < 3; s++) dctx.lineTo(Math.random() * size, Math.random() * size);
        dctx.stroke();
      }
      _normalFromHeightFn(nctx, size, () => Math.random() * 0.5 + 0.5, 4);
      break;
    }
    case 'adobe': {
      _noisyFill(dctx, size, '#c89060', 22);
      _normalFromHeightFn(nctx, size, () => Math.random() * 0.3 + 0.5, 2.5);
      break;
    }
    case 'rammed-earth': {
      // Horizontal bands of varying colors
      const bandH = size / 8;
      for (let i = 0; i < 8; i++) {
        const t = i / 8;
        const r = 130 + Math.round(Math.sin(t * 12) * 22 + (Math.random() - 0.5) * 10);
        const g = 95  + Math.round(Math.sin(t * 12 + 0.4) * 16);
        const b = 65  + Math.round(Math.sin(t * 12 + 0.8) * 12);
        dctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        dctx.fillRect(0, i * bandH, size, bandH);
      }
      // Stipple over
      const id = dctx.getImageData(0, 0, size, size);
      for (let i = 0; i < id.data.length; i += 4) {
        const n = (Math.random() - 0.5) * 18;
        id.data[i]     += n;
        id.data[i + 1] += n * 0.9;
        id.data[i + 2] += n * 0.8;
      }
      dctx.putImageData(id, 0, 0);
      _normalFromHeightFn(nctx, size, (u, v) => 0.5 + Math.sin(v * 50) * 0.2, 3);
      break;
    }
    case 'brick': {
      // Brick coursing with mortar
      const brickH = size / 5, brickW = size / 2.5;
      dctx.fillStyle = '#7a7066';   // mortar
      dctx.fillRect(0, 0, size, size);
      for (let row = 0; row < 5; row++) {
        const offset = (row % 2) * (brickW / 2);
        for (let col = -1; col < 4; col++) {
          const x = col * brickW + offset + 2;
          const y = row * brickH + 2;
          const r = 175 + Math.random() * 25;
          const g = 70 + Math.random() * 20;
          const b = 55 + Math.random() * 15;
          dctx.fillStyle = `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
          dctx.fillRect(x, y, brickW - 4, brickH - 4);
        }
      }
      _normalFromHeightFn(nctx, size, (u, v) => {
        const row = Math.floor(v * 5);
        const off = (row % 2) * 0.2;
        const inCol = ((u + off) * 2.5) % 1;
        const inRow = (v * 5) % 1;
        // Brick faces high, mortar low
        return (inCol > 0.04 && inCol < 0.96 && inRow > 0.04 && inRow < 0.96) ? 0.9 : 0.3;
      }, 7);
      break;
    }
    case 'concrete': {
      _noisyFill(dctx, size, '#8a8e95', 18);
      // sparse pebble specks
      for (let i = 0; i < 80; i++) {
        dctx.fillStyle = `rgba(50, 50, 50, ${0.3 + Math.random() * 0.4})`;
        dctx.beginPath();
        dctx.arc(Math.random() * size, Math.random() * size, 0.5 + Math.random() * 1.5, 0, Math.PI * 2);
        dctx.fill();
      }
      _normalFromHeightFn(nctx, size, () => Math.random() * 0.15 + 0.5, 1.4);
      break;
    }
    case 'wattle-daub': {
      // Cross-hatched weave
      _noisyFill(dctx, size, '#c4a96a', 18);
      dctx.strokeStyle = 'rgba(90, 65, 35, 0.4)';
      dctx.lineWidth = 1.2;
      for (let y = 4; y < size; y += 8) {
        dctx.beginPath(); dctx.moveTo(0, y); dctx.lineTo(size, y); dctx.stroke();
      }
      for (let x = 4; x < size; x += 8) {
        dctx.beginPath(); dctx.moveTo(x, 0); dctx.lineTo(x, size); dctx.stroke();
      }
      _normalFromHeightFn(nctx, size, (u, v) => {
        const a = Math.sin(v * 32) * 0.4 + 0.5;
        const b = Math.sin(u * 32) * 0.4 + 0.5;
        return Math.max(a, b);
      }, 5);
      break;
    }
    default:
      _noisyFill(dctx, size, '#888', 30);
      _normalFromHeightFn(nctx, size, () => Math.random(), 3);
  }
}

const ROUGHNESS_BY_MATERIAL = {
  stone: 0.92, timber: 0.78, mudbrick: 0.95, adobe: 0.88,
  'rammed-earth': 0.96, brick: 0.88, concrete: 0.86, 'wattle-daub': 0.90,
};

/** Cached per-material data: { diffuseCanvas, normalCanvas, smallSphereUrl, largeSphereUrl? } */
const MATERIAL_DATA = {};

function _ensureMaterialData(materialId) {
  if (MATERIAL_DATA[materialId]) return MATERIAL_DATA[materialId];
  const size = 256;
  const diffuse = document.createElement('canvas');
  diffuse.width = diffuse.height = size;
  const dctx = diffuse.getContext('2d');
  const normal = document.createElement('canvas');
  normal.width = normal.height = size;
  const nctx = normal.getContext('2d');
  _paintMaterial(materialId, dctx, nctx, size);
  MATERIAL_DATA[materialId] = {
    materialId,
    diffuseCanvas: diffuse,
    normalCanvas: normal,
    smallSphereUrl: null,
    largeSphereUrl: null,
  };
  return MATERIAL_DATA[materialId];
}

function _materialFromData(data) {
  const dT = new THREE.CanvasTexture(data.diffuseCanvas);
  dT.wrapS = dT.wrapT = THREE.RepeatWrapping;
  dT.colorSpace = THREE.SRGBColorSpace;
  const nT = new THREE.CanvasTexture(data.normalCanvas);
  nT.wrapS = nT.wrapT = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({
    map: dT, normalMap: nT,
    normalScale: new THREE.Vector2(0.7, 0.7),
    roughness: ROUGHNESS_BY_MATERIAL[data.materialId] ?? 0.85,
    metalness: 0.02,
  });
}

function getMaterialPreviewUrl(materialId) {
  const data = _ensureMaterialData(materialId);
  if (!data.smallSphereUrl) {
    data.smallSphereUrl = _renderSphereWithMaterial(_materialFromData(data), PREVIEW_SIZE);
  }
  return data.smallSphereUrl;
}

function getMaterialLargeSphereUrl(materialId) {
  const data = _ensureMaterialData(materialId);
  if (!data.largeSphereUrl) {
    data.largeSphereUrl = _renderSphereWithMaterial(_materialFromData(data), 260);
  }
  return data.largeSphereUrl;
}

function getMaterialCanvases(materialId) {
  const data = _ensureMaterialData(materialId);
  return { diffuseCanvas: data.diffuseCanvas, normalCanvas: data.normalCanvas };
}

/* ── ornament textures: 2D patterns rendered as carved relief on stone ── */

function _drawOrnamentPattern(dctx, nctx, size, ornament) {
  // Base: stone-tinted
  _noisyFill(dctx, size, '#9aa0a8', 26);
  // Pattern overlay (darker = carved deeper)
  dctx.strokeStyle = 'rgba(40, 35, 30, 0.55)';
  dctx.lineWidth = 1.2;

  let heightFn;
  switch (ornament) {
    case 'pointed-arch':
    case 'pointed_arch':
      // Repeating tall pointed arches
      for (let i = 0; i < 4; i++) {
        const x = i * (size / 4) + (size / 8);
        const top = size * 0.25;
        const w = size / 4 * 0.7;
        dctx.beginPath();
        dctx.moveTo(x - w / 2, size * 0.95);
        dctx.lineTo(x - w / 2, size * 0.55);
        dctx.lineTo(x, top);
        dctx.lineTo(x + w / 2, size * 0.55);
        dctx.lineTo(x + w / 2, size * 0.95);
        dctx.stroke();
      }
      heightFn = (u, v) => {
        const inX = (u * 4) % 1;
        const inArch = Math.abs(inX - 0.5) < 0.32 && v > 0.18;
        return inArch ? 0.9 : 0.3;
      };
      break;

    case 'flying-buttress':
    case 'flying_buttress':
      // Angled diagonal struts
      for (let i = 0; i < 6; i++) {
        dctx.beginPath();
        dctx.moveTo(i * size / 6, size);
        dctx.lineTo(i * size / 6 + size * 0.25, 0);
        dctx.stroke();
      }
      heightFn = (u, v) => {
        const d = (u + v * 0.4) % (1 / 6);
        return d < 0.04 ? 1.0 : 0.3;
      };
      break;

    case 'rose-window':
    case 'rose_window':
      // Radial petals
      dctx.strokeStyle = 'rgba(40, 35, 30, 0.5)';
      const cx = size / 2, cy = size / 2;
      dctx.beginPath();
      dctx.arc(cx, cy, size * 0.4, 0, Math.PI * 2);
      dctx.stroke();
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        dctx.beginPath();
        dctx.moveTo(cx + Math.cos(ang) * 5, cy + Math.sin(ang) * 5);
        dctx.lineTo(cx + Math.cos(ang) * size * 0.4, cy + Math.sin(ang) * size * 0.4);
        dctx.stroke();
      }
      heightFn = (u, v) => {
        const dx = u - 0.5, dy = v - 0.5;
        const r = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx);
        const spoke = Math.abs((ang * 4) % 1 - 0.5) < 0.1;
        return (r < 0.42 && (spoke || Math.abs(r - 0.4) < 0.02)) ? 0.95 : 0.4;
      };
      break;

    case 'tracery':
      // Lattice
      for (let x = 0; x < size; x += size / 8) {
        for (let y = 0; y < size; y += size / 8) {
          dctx.strokeRect(x, y, size / 8, size / 8);
        }
      }
      heightFn = (u, v) => {
        const a = ((u * 8) % 1);
        const b = ((v * 8) % 1);
        return (Math.min(a, 1 - a) < 0.06 || Math.min(b, 1 - b) < 0.06) ? 0.95 : 0.45;
      };
      break;

    case 'gargoyle':
    case 'pediment-relief':
    case 'pediment_relief':
    case 'frieze':
      // Generic carved-relief — noisy bumps
      for (let i = 0; i < 30; i++) {
        const x = Math.random() * size, y = Math.random() * size;
        const r = 3 + Math.random() * 8;
        dctx.fillStyle = `rgba(40, 35, 30, ${0.4 + Math.random() * 0.3})`;
        dctx.beginPath();
        dctx.arc(x, y, r, 0, Math.PI * 2);
        dctx.fill();
      }
      heightFn = () => Math.random();
      break;

    default:
      // Subtle hatching
      dctx.strokeStyle = 'rgba(50, 45, 40, 0.4)';
      for (let i = 0; i < 8; i++) {
        dctx.beginPath();
        dctx.moveTo(0, (i + 0.5) * size / 8);
        dctx.lineTo(size, (i + 0.5) * size / 8);
        dctx.stroke();
      }
      heightFn = (u, v) => Math.sin(v * 24) * 0.5 + 0.5;
  }

  _normalFromHeightFn(nctx, size, heightFn, 8);
}

/** Cached per-ornament data: { diffuseCanvas, normalCanvas, smallSphereUrl, largeSphereUrl }. */
const ORNAMENT_DATA = {};

function _ensureOrnamentData(ornament) {
  if (ORNAMENT_DATA[ornament]) return ORNAMENT_DATA[ornament];
  const size = 256;
  const diffuse = document.createElement('canvas');
  diffuse.width = diffuse.height = size;
  const dctx = diffuse.getContext('2d');
  const normal = document.createElement('canvas');
  normal.width = normal.height = size;
  const nctx = normal.getContext('2d');
  _drawOrnamentPattern(dctx, nctx, size, ornament);
  ORNAMENT_DATA[ornament] = {
    ornament,
    diffuseCanvas: diffuse,
    normalCanvas: normal,
    smallSphereUrl: null,
    largeSphereUrl: null,
  };
  return ORNAMENT_DATA[ornament];
}

function _ornamentMaterial(data) {
  const dT = new THREE.CanvasTexture(data.diffuseCanvas);
  dT.wrapS = dT.wrapT = THREE.RepeatWrapping;
  dT.colorSpace = THREE.SRGBColorSpace;
  const nT = new THREE.CanvasTexture(data.normalCanvas);
  nT.wrapS = nT.wrapT = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({
    map: dT, normalMap: nT,
    normalScale: new THREE.Vector2(1.0, 1.0),
    roughness: 0.9, metalness: 0.02,
  });
}

function getOrnamentPreviewUrl(ornament) {
  const data = _ensureOrnamentData(ornament);
  if (!data.smallSphereUrl) {
    data.smallSphereUrl = _renderSphereWithMaterial(_ornamentMaterial(data), PREVIEW_SIZE);
  }
  return data.smallSphereUrl;
}

function getOrnamentLargeSphereUrl(ornament) {
  const data = _ensureOrnamentData(ornament);
  if (!data.largeSphereUrl) {
    data.largeSphereUrl = _renderSphereWithMaterial(_ornamentMaterial(data), 260);
  }
  return data.largeSphereUrl;
}

function getOrnamentCanvases(ornament) {
  const data = _ensureOrnamentData(ornament);
  return { diffuseCanvas: data.diffuseCanvas, normalCanvas: data.normalCanvas };
}


/* ─── boot ──────────────────────────────────────────────── */

renderStats();
// Only render the legacy three-pane views when not on the Cultures tab.
if (state.view !== 'cultures') {
  renderLeftPane();
  renderCenter();
  renderRight();
}
</script>
