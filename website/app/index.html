<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayba — Workbench</title>
  <meta name="description" content="The conlang workbench is not hosted on this site." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/Logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .wb-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
      padding: 2rem;
    }
    .wb-wrap img { width: 64px; height: 64px; opacity: 0.9; }
    .wb-wrap h1 { font-size: 1.6rem; margin: 0; }
    .wb-wrap p { max-width: 34rem; color: var(--muted, #9aa); line-height: 1.6; }
    .wb-wrap a { color: var(--accent, #7A8AB8); }
  </style>
</head>
<body>
  <main class="wb-wrap">
    <img src="/assets/Logo.svg" alt="Hayba" />
    <h1>The conlang workbench isn't hosted here</h1>
    <p>
      The linguistics library is early research. Its source lives in the
      <a href="https://github.com/zajalist/hayba/tree/main/packages/linguistics" target="_blank" rel="noopener">repository</a>
      and is separate from Hayba's Unreal toolkit. There is no hosted version.
    </p>
    <p><a href="/">← Back to hayba</a></p>
  </main>
</body>
</html>
