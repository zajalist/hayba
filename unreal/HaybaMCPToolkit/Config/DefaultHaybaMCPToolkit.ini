; Redirects for the sliver -> Recipe rename.
;
; These cover ASSET references -- anything that serialised a reference to the
; old class or enum resolves to the new one instead of failing to load.
;
; They do NOT cover the settings themselves. That was the obvious assumption
; and it is wrong: a config UCLASS's saved values live in a section keyed by
; the class path, and the config system never consults CoreRedirects when
; looking a section up. Verified rather than assumed -- MaxSliverDepth=17 was
; seeded under the old section, and after the rename the class read back the
; default 8. There is no engine-side section-rename mechanism either.
;
; The settings migration is therefore explicit, in
; UHaybaRecipeSettings::MigrateLegacyConfigSection().
;
; File name and entry format follow the engine's own plugins -- see
; Engine/Plugins/2D/Paper2D/Config/DefaultPaper2D.ini.

[CoreRedirects]

+ClassRedirects=(OldName="HaybaSliverSettings", NewName="/Script/HaybaMCPToolkit.HaybaRecipeSettings")

+EnumRedirects=(OldName="EHaybaSliverRunMode", NewName="/Script/HaybaMCPToolkit.EHaybaRecipeRunMode")

+PropertyRedirects=(OldName="HaybaRecipeSettings.MaxSliverDepth", NewName="HaybaRecipeSettings.MaxRecipeDepth")
