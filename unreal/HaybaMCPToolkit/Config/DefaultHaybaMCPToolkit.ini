; Redirects for the sliver -> Recipe rename.
;
; UHaybaSliverSettings is a config UCLASS, so its saved values live under
; [/Script/HaybaMCPToolkit.HaybaSliverSettings] in the user's
; EditorPerProjectUserSettings.ini. Renaming the class without these entries
; would orphan that section: the user's configured McpHttpBaseUrl and their
; recursion depth would silently revert to defaults, with nothing to indicate
; why. The enum is BlueprintType, so any asset referencing it needs the same
; treatment.
;
; Form and file name follow the engine's own plugins -- see
; Engine/Plugins/2D/Paper2D/Config/DefaultPaper2D.ini.

[CoreRedirects]

+ClassRedirects=(OldName="HaybaSliverSettings", NewName="/Script/HaybaMCPToolkit.HaybaRecipeSettings")

+EnumRedirects=(OldName="EHaybaSliverRunMode", NewName="/Script/HaybaMCPToolkit.EHaybaRecipeRunMode")

+PropertyRedirects=(OldName="HaybaRecipeSettings.MaxSliverDepth", NewName="HaybaRecipeSettings.MaxRecipeDepth")
